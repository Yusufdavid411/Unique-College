name: Validate platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: college_test
          POSTGRES_PASSWORD: local_ci_test_password
          POSTGRES_DB: unique_college_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://college_test:local_ci_test_password@localhost:5432/unique_college_test
      INTEGRATION_DATABASE_URL: postgresql://college_test:local_ci_test_password@localhost:5432/unique_college_test
      JWT_SECRET: unique_college_ci_only_test_secret_not_for_production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run prisma:generate --prefix backend
      - run: npm run prisma:deploy --prefix backend
      - run: npm run db:check --prefix backend
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend
