<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unique College of Health Science and Technology offers modern health science education, laboratory training, and professional healthcare pathways."
    />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#0a5ea8" />
    <script>if (/^\/(applicant|admin)(\/|$)/.test(location.pathname)) document.documentElement.setAttribute("data-applicant-access", "true");</script>
    <style>html[data-applicant-access],html[data-applicant-access] body,html[data-applicant-access] #root{margin:0;min-height:100svh;background:#06375f}</style>
    <link rel="icon" type="image/jpeg" href="/school-assets/logo-new.jpg" />
    <link rel="apple-touch-icon" href="/school-assets/logo-new.jpg" />
    <title>Unique College</title>
  </head>
  <body>
    <div id="root"><section id="app-startup-error" hidden style="padding:48px 24px;color:white;background:#06375f;min-height:100svh;font-family:system-ui"><h1>Unique College</h1><p>The page could not finish loading. Check your connection and try again.</p><button type="button" onclick="location.reload()">Reload page</button> <a href="/" style="color:white">Return to homepage</a></section></div>
    <script>function showStartupError(){if(!document.documentElement.dataset.appReady){var panel=document.getElementById("app-startup-error");if(panel)panel.hidden=false;}}window.addEventListener("error",function(event){if(event.target&&event.target.tagName==="SCRIPT")showStartupError();},true);setTimeout(showStartupError,15000);</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
